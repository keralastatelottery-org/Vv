function normaliseRows(rows){
  if(!Array.isArray(rows)) return [];
  return rows.map((r,i)=>{
    const id=r.id||r.game_id||r.slug||("sheet-game-"+i);
    const name=r.name||r.title||r.game_name;
    if(!name) return null;
    const cat=r.category||r.type||"game";

    const play=r.playUrl||r.play_url||r.url||r.game_url||"";

async function loadSheet(){
  try{
